),I("wine","料酒",10,"ml"),I("water","清水",25,"ml"),I("oil","食用油",25,"ml","调味","使用非花生油"),I("salt","盐",1,"g")],tools:["炒锅 / 不粘锅","锅铲","砧板与刀","两个小碗"],key:"先调好碗汁，炒鸡丁时不离开灶台。花生最后放，才能保持酥脆。",prep:[{id:"cut",title:"切鸡丁与配料",detail:"鸡肉切成约 1.5 cm 的小丁；葱切小段，姜蒜切片，干辣椒剪段。生肉与熟食分开处理。",uses:["chicken","scallion","ginger","garlic","chili"]},{id:"marinate",title:"腌制鸡丁",detail:"鸡丁加入全部料酒、盐，以及 1/3 生抽、1/2 淀粉、1/5 食用油，抓匀腌制 10 分钟。",uses:["wine","salt","soy","starch","oil"],seconds:600,parallel:"等待腌制时，完成下面的调汁。"},{id:"sauce",title:"调宫保汁",detail:"剩余生抽、淀粉与全部米醋、糖、清水混匀。下锅前再搅一次，防止淀粉沉底。",uses:["soy","vinegar","sugar","starch","water"],parallel:"可与腌制同时进行"},{id:"tools",title:"准备花生与餐具",detail:"熟花生单独放一碗，配料与碗汁摆在灶台旁；准备干净的盛菜盘。",uses:["peanuts","pepper","oil"]}],steps:[{id:"heat",title:"热锅放油",action:"锅中倒入剩余 4/5 食用油，轻轻转动锅，让油均匀铺开。使用不粘锅时不要长时间空烧。",uses:["oil"],heat:"中火",seconds:30,signal:"油变得流动轻快，锅底有细小油纹，还没有明显冒烟。",tip:"油冒烟就太热了，先离火稍降温再下鸡丁。",why:"锅和油提前升温，能帮助鸡肉快速定形，减少粘锅和出水。"},{id:"chicken",title:"滑炒鸡丁",action:"倒入腌好的鸡丁，铺开约 20 秒后再翻炒。炒至表面全部变白，先盛出备用，稍后还会回锅炒熟。",uses:["chicken"],heat:"中大火",seconds:90,signal:"鸡丁表面变白、颗粒分开；此时还未完全熟，不要试吃。",tip:"一次下锅过多会降温。锅小或超过 3 人份时，分两批炒。",why:"先炒后盛出，能避免鸡丁与配料一起长时间加热，口感更嫩。"},{id:"aromatics",title:"小火炒香配料",action:"锅内留底油，放入干辣椒、花椒、姜蒜片，轻轻翻炒，再加入葱段炒出香味。",uses:["chili","pepper","ginger","garlic","scallion"],heat:"小火",seconds:30,signal:"闻到姜蒜和辣椒的香味，辣椒变深红但没有发黑。",tip:"辣椒容易糊。变黑或闻到苦味，取出后再继续。",why:"小火让香气慢慢释放，不会把辣椒和花椒炒苦。"},{id:"sauce",title:"鸡丁回锅调味",action:"鸡丁倒回锅中，转中大火；搅匀碗汁，沿锅边淋入，快速翻炒，让酱汁均匀裹住鸡丁。",uses:["chicken","soy","vinegar","sugar","starch","water"],heat:"中大火",seconds:60,signal:"酱汁变亮、略微浓稠，切开最大一块鸡肉，中心不透明、没有粉红色；有温度计时确认中心达到 74°C。",tip:"汁收得太快时，每次加 5 ml 热水；鸡肉未熟时继续加热并复查。",why:"淀粉遇热后糊化，让碗汁形成薄薄的芡，挂在鸡丁上。"},{id:"finish",title:"放花生，翻匀出锅",action:"加入熟花生，快速翻匀后立即关火装盘，趁热享用。",uses:["peanuts"],heat:"关火前快速翻炒",seconds:10,signal:"鸡丁均匀裹汁，盘底没有大量流动汤汁，花生仍然酥脆。",tip:"花生不要在酱汁里久煮，否则会失去脆口。",why:"花生吸水会变软，临出锅时加入能保留口感。"}]},{id:"eggs",title:"番茄炒蛋",subtitle:"软嫩的蛋，裹上酸甜的番茄汁",image:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgH :95,level:"耐心慢炖",tags:["暖心炖菜","不辣","两人食"],main:"牛腩",mainAmount:400,ingredients:[I("beef","牛腩",400,"g","主料"),I("potato","土豆",250,"g","主料"),I("ginger","生姜",15,"g"),I("scallion","大葱",20,"g"),I("soy","生抽",20,"ml"),I("darksoy","老抽",5,"ml"),I("wine","料酒",15,"ml"),I("sugar","冰糖",8,"g"),I("oil","食用油",15,"ml"),I("water","热水",800,"ml"),I("anise","八角",1,"个"),I("salt","盐",1,"g")],tools:["带盖炒锅 / 炖锅","锅铲","砧板与刀","滤网"],key:"牛肉先炖软，再放土豆。水量以刚没过食材为准，中途补热水。",prep:[{id:"cut",title:"切牛腩与葱姜",detail:"牛腩切约 3 cm 块，清水冲洗；生姜切片，大葱切段。",uses:["beef","ginger","scallion"]},{id:"potato",title:"土豆去皮切块",detail:"土豆切成约 3 cm 块，泡入清水防止变色；下锅前沥干。",uses:["potato"],parallel:"可在牛肉炖煮时完成"},{id:"tools",title:"备好调味与热水",detail:"量好调味料，烧好热水，准备能盖严的锅盖。",uses:["soy","darksoy","wine","sugar","oil","anise","salt","water"]}],steps:[{id:"blanch",title:"冷水焯牛肉",action:"牛肉冷水下锅，水没过牛肉。加入 1/3 姜片和全部料酒，煮开后撇去浮沫，捞出用温水冲净。焯水用水不计入炖煮用水。",uses:["beef","ginger","wine"],heat:"大火煮开",seconds:300,signal:"表面浮沫明显减少，牛肉表面变色。",tip:"焯水后用温水冲洗，避免牛肉骤冷。",why:"冷水开始加热，能帮助牛肉中的血水释放。"},{id:"fry",title:"炒香配料与牛肉",action:"锅中加食用油，放剩余姜片、葱、八角炒香。倒入沥干的牛肉，加冰糖、生抽、老抽，翻炒均匀。",uses:["oil","ginger","scallion","anise","beef","sugar","soy","darksoy"],heat:"中火",seconds:120,signal:"牛肉表面均匀上色，闻到香料香气。",tip:"牛肉先沥干，避免热油飞溅。",why:"翻炒能让配料香气融入油中，后续炖煮更入味。"},{id:"braise",title:"小火炖牛肉",action:"倒入热水至刚没过牛肉。大火烧开后转小火，盖盖炖约 60 分钟；每 20 分钟查看一次，水不足就补热水。",uses:["water","beef"],heat:"大火烧开 → 小火",seconds:3600,signal:"筷子能较容易插入牛肉，口感开始变软。未软就继续每 10 分钟检查。",tip:"保持轻微冒泡。计时只作参考，以牛肉软烂程度为准。",why:"温和且持续的加热，能让牛腩中的结缔组织逐渐软化。"},{id:"potato",title:"加入土豆炖煮",action:"加入沥干的土豆和盐，轻轻推匀，继续加盖小火炖约 20 分钟。",uses:["potato","salt"],heat:"小火",seconds:1200,signal:"筷子轻松穿过土豆，边缘略松软但整体完整，牛肉已经软烂。",tip:"土豆还硬就继续炖，不要为了收汁提前出锅。",why:"土豆比牛肉更容易熟，后放能避免全部炖碎。"},{id:"finish",title:"开盖收汁",action:"开盖转中火，轻推食材防止粘底。汤汁收浓后关火装盘，取出八角等大块香料。",uses:[],heat:"中火",seconds:180,signal:"酱汁略浓，能挂在牛肉与土豆表面，盘中保留少量汤汁。",tip:"别收得过干，稍留汤汁更适合拌饭。",why:"开盖让水分蒸发，味道更集中。"}]}];Na.push({id:"pasta",title:"番茄罗勒意面",subtitle:"",cuisine:"意式",image:"",minutes:25,level:"简单",tags:["意式","酸甜"],m
